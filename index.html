<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite — Music Courses Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#161615;
    --paper:#FFFFFF;
    --bg:#F3F3F1;
    --line:#D9D8D4;
    --muted:#78766F;
    --muted-2:#A8A6A0;
    --present:#161615;
    --absent:#B9B7B0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Fraunces', serif; }

  /* Layout */
  .shell{ display:flex; min-height:100vh; }

  .rail{
    width:220px;
    flex-shrink:0;
    background:var(--ink);
    color:var(--bg);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:32px 24px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .rail-top .wordmark{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.01em;
    line-height:1;
  }
  .rail-top .tagline{
    font-size:12px;
    color:#9C9A93;
    margin-top:6px;
    line-height:1.4;
  }
  .nav{ margin-top:56px; display:flex; flex-direction:column; gap:4px; }
  .nav button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:2px;
    font-size:14px;
    color:#C7C5BE;
    transition:background .15s ease, color .15s ease;
  }
  .nav button:hover{ background:#232321; color:var(--paper); }
  .nav button.active{ background:#2B2A27; color:var(--paper); font-weight:500; }
  .rail-bottom{ font-size:12px; color:#7C7A73; line-height:1.5; }
  .rail-bottom .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    margin-right:6px; position:relative; top:-1px;
  }
  .dot.ok{ background:#8FBF8F; }
  .dot.warn{ background:#D9B36A; }

  main{ flex:1; padding:44px 56px; max-width:1200px; }

  .topline{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:36px; flex-wrap:wrap; gap:16px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:32px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--muted); font-size:14px; margin-top:6px; }

  .stats{ display:flex; gap:36px; margin-bottom:40px; flex-wrap:wrap; }
  .stat{ border-left:1px solid var(--line); padding-left:16px; min-width:120px; }
  .stat .num{ font-family:'Fraunces', serif; font-size:30px; font-weight:500; }
  .stat .label{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:16px; flex-wrap:wrap;
  }
  .search{
    flex:1; max-width:340px;
    border:1px solid var(--line); background:var(--paper);
    padding:9px 12px; font-size:14px; font-family:'Inter',sans-serif;
    border-radius:2px; color:var(--ink);
  }
  .search:focus{ outline:none; border-color:var(--ink); }
  .btn{
    all:unset; cursor:pointer;
    background:var(--ink); color:var(--paper);
    padding:10px 18px; font-size:13.5px; font-weight:500;
    border-radius:2px; letter-spacing:0.01em;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:0.82; }
  .btn.ghost{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  .btn.ghost:hover{ border-color:var(--ink); opacity:1; background:#EAE9E5; }
  .btn.danger{ background:transparent; color:#8A392F; }
  .btn.small{ padding:6px 12px; font-size:12.5px; }

  table{ width:100%; border-collapse:collapse; background:var(--paper); }
  thead th{
    text-align:left; font-weight:500; font-size:12.5px; color:var(--muted);
    padding:12px 14px; border-bottom:1px solid var(--ink);
  }
  tbody td{
    padding:14px 14px; font-size:14px; border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:hover{ background:#FAFAF8; }
  .name-cell .name{ font-weight:500; }
  .name-cell .joined{ font-size:12px; color:var(--muted-2); margin-top:2px; }
  .school-cell .school{ }
  .school-cell .grade{ font-size:12px; color:var(--muted); margin-top:2px; }
  .att-cell{ display:flex; align-items:center; gap:10px; }
  .att-num{ font-variant-numeric:tabular-nums; }
  .att-num.present{ color:var(--ink); font-weight:500; }
  .att-num.absent{ color:#8A392F; }
  .row-actions{ display:flex; gap:6px; }
  .row-actions button{
    all:unset; cursor:pointer; font-size:12px; color:var(--muted);
    padding:4px 8px; border:1px solid var(--line); border-radius:2px;
  }
  .row-actions button:hover{ border-color:var(--ink); color:var(--ink); }
  .empty{ text-align:center; padding:64px 20px; color:var(--muted); }
  .empty .display{ font-size:20px; color:var(--ink); margin-bottom:6px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(22,22,21,0.45);
    display:none; align-items:flex-start; justify-content:center;
    padding:60px 20px; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:2px; padding:32px; max-height:82vh; overflow:auto;
  }
  .modal h2{ font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin:0 0 22px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; border:1px solid var(--line); padding:9px 11px;
    font-size:14px; font-family:'Inter',sans-serif; border-radius:2px; color:var(--ink);
    background:var(--paper);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--ink); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:26px; }

  .config-banner{
    background:#EEEDE9; border:1px solid var(--line); padding:16px 20px;
    font-size:13px; color:var(--muted); margin-bottom:32px; line-height:1.6;
    border-radius:2px;
  }
  .config-banner code{ background:#E3E2DD; padding:1px 6px; border-radius:2px; }

  @media (max-width: 840px){
    .rail{ display:none; }
    main{ padding:28px 20px; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    tbody tr{ border:1px solid var(--line); margin-bottom:12px; border-radius:2px; }
    tbody td{ border:none; padding:8px 14px; }
    tbody td:before{
      content: attr(data-label);
      display:block; font-size:11px; color:var(--muted-2); margin-bottom:2px;
    }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="rail-top">
      <div class="wordmark">Elite</div>
      <div class="tagline">Music Courses Center<br>Student Roster</div>
      <nav class="nav">
        <button class="active" data-view="roster">Roster</button>
        <button data-view="add">Add student</button>
      </nav>
    </div>
    <div class="rail-bottom">
      <span class="dot ok" id="conn-dot"></span><span id="conn-text">Checking connection…</span>
    </div>
  </aside>

  <main>
    <div id="config-banner-slot"></div>

    <div class="topline">
      <div>
        <h1>Student roster</h1>
        <div class="sub">Every student, one record each — instrument, school, attendance and contact.</div>
      </div>
      <button class="btn" id="open-add-top">Add student</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input class="search" id="search" type="text" placeholder="Search by name, instrument or school…">
      <div style="font-size:12.5px;color:var(--muted)" id="count-label"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Instrument</th>
          <th>School &amp; grade</th>
          <th>Attendance</th>
          <th>Contact</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none">
      <div class="display">No students yet</div>
      <div>Add your first student to start tracking their roster.</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Add student</h2>
    <form id="student-form">
      <input type="hidden" id="student-id">
      <div class="field">
        <label for="f-name">Student name</label>
        <input id="f-name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-joined">Date joined</label>
          <input id="f-joined" type="date" required>
        </div>
        <div class="field">
          <label for="f-instrument">Instrument</label>
          <input id="f-instrument" placeholder="Piano, guitar, violin…" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-school">School</label>
          <input id="f-school" required>
        </div>
        <div class="field">
          <label for="f-grade">Grade</label>
          <input id="f-grade" placeholder="e.g. Grade 6" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-attendance">Sessions attended</label>
          <input id="f-attendance" type="number" min="0" value="0" required>
        </div>
        <div class="field">
          <label for="f-absence">Sessions absent</label>
          <input id="f-absence" type="number" min="0" value="0" required>
        </div>
      </div>
      <div class="field">
        <label for="f-contact">Contact (phone or email)</label>
        <input id="f-contact" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="button" class="btn ghost danger" id="delete-btn" style="display:none">Delete</button>
        <button type="submit" class="btn" id="save-btn">Save student</button>
      </div>
    </form>
  </div>
</div>

<script>
  /* ---------------------------------------------------------------
     SUPABASE CONFIG
     Replace these two values with your own project's URL and anon key
     (Supabase dashboard → Project Settings → API).
     See README.md for the table schema this app expects.
  --------------------------------------------------------------- */
  const SUPABASE_URL = "https://xocychtfzzqbhiyaapsz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvY3ljaHRmenpxYmhpeWFhcHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNzIyMjYsImV4cCI6MjEwNDc0ODIyNn0.EVKvnpQkZ6bjbT2Iri20OUvK5ik-4iOFgrZIxDhlfTw";

  const configured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
  let supa = null;
  if (configured) {
    supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const els = {
    banner: document.getElementById('config-banner-slot'),
    stats: document.getElementById('stats'),
    tbody: document.getElementById('table-body'),
    empty: document.getElementById('empty-state'),
    search: document.getElementById('search'),
    countLabel: document.getElementById('count-label'),
    overlay: document.getElementById('overlay'),
    form: document.getElementById('student-form'),
    modalTitle: document.getElementById('modal-title'),
    deleteBtn: document.getElementById('delete-btn'),
    connDot: document.getElementById('conn-dot'),
    connText: document.getElementById('conn-text'),
  };

  let students = [];

  function showBanner(isError, message){
    if (isError){
      els.banner.innerHTML = `
        <div class="config-banner" style="border-color:#8A392F;color:#8A392F;">
          Supabase error: ${escapeHtml(message)}
        </div>`;
      return;
    }
    if (configured) return;
    els.banner.innerHTML = `
      <div class="config-banner">
        This page isn't connected to Supabase yet. Open <code>index.html</code> and set
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the bottom of the file
        (see README.md for the table schema to run first). Showing sample data below in the meantime.
      </div>`;
    els.connDot.className = 'dot warn';
    els.connText.textContent = 'Not connected — sample data';
  }

  const sample = [
    { id:'s1', name:'Amira Haddad', date_joined:'2025-02-10', instrument:'Piano', school:'Greenfield Academy', grade:'Grade 5', attendance_count:34, absence_count:2, contact:'amira.h@email.com' },
    { id:'s2', name:'Karim Youssef', date_joined:'2024-11-03', instrument:'Guitar', school:'Nile International School', grade:'Grade 8', attendance_count:51, absence_count:6, contact:'01055512233' },
    { id:'s3', name:'Lina Farouk', date_joined:'2025-06-21', instrument:'Violin', school:'Cedar Hills School', grade:'Grade 3', attendance_count:12, absence_count:0, contact:'lina.farouk@email.com' },
  ];

  function describeError(error){
    if (!error) return 'Unknown error';
    return error.message || error.error_description || error.details || error.hint || JSON.stringify(error);
  }

  async function loadStudents(){
    if (!configured) { students = sample; render(); return; }
    try {
      const { data, error } = await supa.from('students').select('*').order('created_at', { ascending:false });
      if (error){
        els.connDot.className = 'dot warn';
        els.connText.textContent = 'Connection error — see below';
        showBanner(true, describeError(error));
        students = [];
      } else {
        els.connDot.className = 'dot ok';
        els.connText.textContent = 'Connected to Supabase';
        students = data;
      }
    } catch (e){
      els.connDot.className = 'dot warn';
      els.connText.textContent = 'Could not reach Supabase';
      showBanner(true, describeError(e));
      students = [];
    }
    render();
  }

  function fmtDate(d){
    if (!d) return '—';
    const dt = new Date(d + (d.length===10 ? 'T00:00:00' : ''));
    return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }

  function render(){
    const q = els.search.value.trim().toLowerCase();
    const filtered = students.filter(s =>
      !q || [s.name, s.instrument, s.school, s.grade].some(v => (v||'').toLowerCase().includes(q))
    );

    // stats
    const totalAtt = students.reduce((a,s)=>a+(s.attendance_count||0),0);
    const totalAbs = students.reduce((a,s)=>a+(s.absence_count||0),0);
    els.stats.innerHTML = `
      <div class="stat"><div class="num display">${students.length}</div><div class="label">Enrolled students</div></div>
      <div class="stat"><div class="num display">${totalAtt}</div><div class="label">Sessions attended</div></div>
      <div class="stat"><div class="num display">${totalAbs}</div><div class="label">Sessions absent</div></div>
    `;

    els.countLabel.textContent = `${filtered.length} of ${students.length} shown`;

    if (filtered.length === 0){
      els.tbody.innerHTML = '';
      els.empty.style.display = 'block';
      return;
    }
    els.empty.style.display = 'none';

    els.tbody.innerHTML = filtered.map(s => `
      <tr>
        <td class="name-cell" data-label="Student">
          <div class="name">${escapeHtml(s.name)}</div>
          <div class="joined">Joined ${fmtDate(s.date_joined)}</div>
        </td>
        <td data-label="Instrument">${escapeHtml(s.instrument||'—')}</td>
        <td class="school-cell" data-label="School & grade">
          <div class="school">${escapeHtml(s.school||'—')}</div>
          <div class="grade">${escapeHtml(s.grade||'—')}</div>
        </td>
        <td data-label="Attendance">
          <div class="att-cell">
            <span class="att-num present">${s.attendance_count||0} attended</span>
            <span style="color:var(--muted-2)">·</span>
            <span class="att-num absent">${s.absence_count||0} absent</span>
          </div>
        </td>
        <td data-label="Contact">${escapeHtml(s.contact||'—')}</td>
        <td data-label="">
          <div class="row-actions">
            <button data-action="present" data-id="${s.id}">+ present</button>
            <button data-action="absent" data-id="${s.id}">+ absent</button>
            <button data-action="edit" data-id="${s.id}">Edit</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // --- modal handling ---
  function openModal(student){
    els.modalTitle.textContent = student ? 'Edit student' : 'Add student';
    document.getElementById('student-id').value = student ? student.id : '';
    document.getElementById('f-name').value = student ? student.name : '';
    document.getElementById('f-joined').value = student ? student.date_joined : new Date().toISOString().slice(0,10);
    document.getElementById('f-instrument').value = student ? student.instrument : '';
    document.getElementById('f-school').value = student ? student.school : '';
    document.getElementById('f-grade').value = student ? student.grade : '';
    document.getElementById('f-attendance').value = student ? (student.attendance_count||0) : 0;
    document.getElementById('f-absence').value = student ? (student.absence_count||0) : 0;
    document.getElementById('f-contact').value = student ? student.contact : '';
    els.deleteBtn.style.display = student ? 'inline-block' : 'none';
    els.overlay.classList.add('open');
  }
  function closeModal(){ els.overlay.classList.remove('open'); }

  document.getElementById('open-add-top').addEventListener('click', ()=>openModal(null));
  document.querySelector('[data-view="add"]').addEventListener('click', ()=>openModal(null));
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  els.overlay.addEventListener('click', (e)=>{ if (e.target === els.overlay) closeModal(); });

  els.form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id = document.getElementById('student-id').value;
    const payload = {
      name: document.getElementById('f-name').value.trim(),
      date_joined: document.getElementById('f-joined').value,
      instrument: document.getElementById('f-instrument').value.trim(),
      school: document.getElementById('f-school').value.trim(),
      grade: document.getElementById('f-grade').value.trim(),
      attendance_count: parseInt(document.getElementById('f-attendance').value||0,10),
      absence_count: parseInt(document.getElementById('f-absence').value||0,10),
      contact: document.getElementById('f-contact').value.trim(),
    };

    if (!configured){
      if (id){
        students = students.map(s => s.id===id ? {...s, ...payload} : s);
      } else {
        students.unshift({ id: 's'+Date.now(), ...payload });
      }
      closeModal(); render();
      return;
    }

    if (id){
      const { error } = await supa.from('students').update(payload).eq('id', id);
      if (error) return alert('Could not save: ' + describeError(error));
    } else {
      const { error } = await supa.from('students').insert(payload);
      if (error) return alert('Could not save: ' + describeError(error));
    }
    closeModal();
    loadStudents();
  });

  els.deleteBtn.addEventListener('click', async ()=>{
    const id = document.getElementById('student-id').value;
    if (!id) return;
    if (!confirm('Delete this student? This cannot be undone.')) return;
    if (!configured){
      students = students.filter(s=>s.id!==id);
      closeModal(); render();
      return;
    }
    const { error } = await supa.from('students').delete().eq('id', id);
    if (error) return alert('Could not delete: ' + describeError(error));
    closeModal();
    loadStudents();
  });

  els.tbody.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const student = students.find(s=>s.id===id);
    if (!student) return;

    if (action === 'edit'){ openModal(student); return; }

    const field = action === 'present' ? 'attendance_count' : 'absence_count';
    const newVal = (student[field]||0) + 1;

    if (!configured){
      student[field] = newVal;
      render();
      return;
    }
    const { error } = await supa.from('students').update({ [field]: newVal }).eq('id', id);
    if (error) return alert('Could not update: ' + describeError(error));
    loadStudents();
  });

  els.search.addEventListener('input', render);

  showBanner();
  loadStudents();
</script>
</body>
</html>
